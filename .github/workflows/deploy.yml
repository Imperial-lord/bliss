name: CD - Deploy to OCI

on:
  push:
    branches: [ main ]
    paths:
      - 'client/**'
      - 'server/**'
      - 'package*.json'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to OCI (VM 1 & VM 2)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Client Dependencies
        run: npm ci --prefix client

      - name: Build Production Client SPA
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
        run: npm run build --prefix client

      - name: Copy Client Dist to VM 1 (Static SPA)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "client/dist/*"
          target: "/tmp/bliss-deploy"
          strip_components: 2

      - name: Update VM 1 Nginx & Deploy to VM 2 Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ubuntu
          key: ${{ secrets.OCI_SSH_KEY }}
          script: |
            # 1. Move new frontend build to /var/www/bliss on VM 1
            sudo mkdir -p /var/www/bliss
            sudo cp -r /tmp/bliss-deploy/* /var/www/bliss/
            sudo rm -rf /tmp/bliss-deploy
            sudo systemctl reload nginx
            echo "✓ VM 1 frontend updated and Nginx reloaded"

            # 2. Sync server files to VM 2 and restart container
            ssh -o StrictHostKeyChecking=no -i ~/.ssh/bliss_oci_key ubuntu@10.0.1.20 "
              cd /home/ubuntu/bliss &&
              docker compose restart backend
            "
            echo "✓ VM 2 backend reloaded"
