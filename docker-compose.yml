services:
  frontend:
    image: nginx:alpine
    container_name: bliss-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./client/dist:/usr/share/nginx/html:ro
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: bliss-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - NODE_ENV=production
      - PORT=5001
      - CLIENT_ORIGINS=http://bliss.webhop.me,https://bliss.webhop.me,http://140.245.246.201,http://localhost:5173,http://localhost:3000
      - OCI_OBJECT_STORAGE_NAMESPACE=axxfp6gwj5at
      - OCI_OBJECT_STORAGE_BUCKET=bliss-cinema-cache
    volumes:
      - /tmp/webtorrent:/tmp/webtorrent
      - ~/.oci/docker-config:/root/.oci/config:ro
      - ~/.oci/oci_api_key.pem:/root/.oci/oci_api_key.pem:ro
