# =========================================================================
# Bliss Nginx Edge Router & Reverse Proxy Configuration for VM 1 (AMD Micro)
# Hostname: bliss.webhop.me
# Upstreams:
#   - VM 2 (Frontend Static SPA):    http://10.0.1.20:80
#   - VM 3 (WebRTC Signaling):       http://10.0.1.30:5001
#   - VM 4 (Torrent & Media Stream): http://10.0.1.40:5001
# =========================================================================

# Upstream definitions
upstream frontend_vm2 {
    server 10.0.1.20:80;
    keepalive 32;
}

upstream signaling_vm3 {
    server 10.0.1.30:5001;
    keepalive 64;
}

upstream cinema_stream_vm4 {
    server 10.0.1.40:5001;
    keepalive 32;
}

# 1. HTTP -> HTTPS Redirection + Certbot ACME Challenge
server {
    listen 80;
    listen [::]:80;
    server_name bliss.webhop.me;

    # Let's Encrypt renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bliss.webhop.me;

    # SSL Certificates (managed via Certbot)
    ssl_certificate /etc/letsencrypt/live/bliss.webhop.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bliss.webhop.me/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------------
    # A. WebRTC Signaling & Socket.IO (VM 3)
    # ---------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://signaling_vm3;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time WebRTC signal transmission
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---------------------------------------------------------------------
    # B. Torrent & Cinema Video Streaming (VM 4)
    # ---------------------------------------------------------------------
    location /api/ {
        proxy_pass http://cinema_stream_vm4;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support Range Requests & Large Video Streams
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------------------------------------------------------------------
    # C. Frontend Static Application (VM 2)
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_vm2;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";
    }
}
